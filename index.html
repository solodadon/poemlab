<body>
    <h1 class="title">Dreams Poem</h1>
    <h2 class="author">By Langston Hughes</h2>
    <p class="poem"> Hold fast to dreams
        For if dreams die
        Life is a broken-winged bird
        That cannot fly.
        Hold fast to dreams
        For when dreams go
        Life is a barren field
        Frozen with snow.</p>
